<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: lightblue;
            padding: 25px;
            text-align: center;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lightpink;
            padding: 30px;
            text-align: center;
        }

        .main {
            grid-area: main;
            background-color: lightyellow;
            padding: 50px;
            text-align: center;
        }

        .footer {
            grid-area: footer;
            background-color: lightgreen;
            padding: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h2>Header</h2>
        </div>

        <div class="sidebar">
            <h3>Sidebar</h3>
        </div>

        <div class="main">
            <h3>Main Content</h3>
            <p>Welcome to the Dashboard Layout.</p>
        </div>

        <div class="footer">
            <h3>Footer</h3>
        </div>

    </div>

</body>
</html>
