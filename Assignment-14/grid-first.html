<!DOCTYPE html>
<html>
<head>
    <title>Grid First</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
            font-size: 25px;
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>CSS Grid Layout</h1>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

</body>
</html>
