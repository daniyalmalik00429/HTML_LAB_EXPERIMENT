<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box1 {
            width: 200px;
            padding: 20px;
            border: 5px solid black;
            box-sizing: content-box;
            background-color: lightblue;
            margin-bottom: 20px;
        }

        .box2 {
            width: 200px;
            padding: 20px;
            border: 5px solid black;
            box-sizing: border-box;
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>CSS Box Model</h1>

    <div class="box1">
        Content Box
    </div>

    <div class="box2">
        Border Box
    </div>

</body>
</html>
