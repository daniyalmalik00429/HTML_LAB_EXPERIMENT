<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>Responsive Image</h1>

    <img src="image.png" alt="Responsive Picture">

</body>
</html>
