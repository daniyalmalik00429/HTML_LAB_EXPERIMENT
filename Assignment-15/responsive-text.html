<!DOCTYPE html>
<html>
<head>
    <title>Responsive Text</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 1rem;
        }

        h1 {
            font-size: 1.5rem;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Text</h1>

    <p>
        This is a responsive paragraph.
        The text size changes according to the screen size.
        Media queries help to make web pages responsive
        on mobile phones, tablets and computers.
    </p>

</body>
</html>
