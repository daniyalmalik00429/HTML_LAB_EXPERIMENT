<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>

    <style>
        .box1 {
            width: 200px;
            height: 40px;
            background-color: lightblue;
        }

        .box2 {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
        }

        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>CSS Units Example</h1>

    <div class="box1">200px wide box</div>

    <br>

    <div class="box2">50% wide box</div>

    <p>This paragraph has a font size of 1.5rem.</p>

</body>
</html>
