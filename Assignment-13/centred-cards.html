<!DOCTYPE html>
<html>
<head>
    <title>Centred Cards</title>
    
    <style>
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 300px;
        }

        .card {
            background-color: lightblue;
            padding: 30px;
            width: 150px;
            text-align: center;
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <div class="row">
        <div class="card">
            <h3>Starter</h3>
            <p>Price: 199</p>
        </div>

        <div class="card">
            <h3>Standard</h3>
            <p>Price: 349</p>
        </div>

        <div class="card">
            <h3>Premium</h3>
            <p>Price: 499</p>
        </div>
    </div>

</body>
